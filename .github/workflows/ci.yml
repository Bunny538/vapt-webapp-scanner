name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: pytest -q

  scan-lab:
    # Demonstrates the scanner in a pipeline: scan the vulnerable lab, publish the report.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Start lab target (localhost only)
        run: |
          python -m lab.app --port 5000 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:5000/ >/dev/null && break; sleep 0.5; done
      - name: Scan the lab
        run: vapt scan http://127.0.0.1:5000 --out reports --fail-on none
      - uses: actions/upload-artifact@v4
        with:
          name: vapt-report
          path: reports/
